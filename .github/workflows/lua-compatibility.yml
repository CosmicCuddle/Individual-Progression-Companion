name: WoW 3.3.5a Lua compatibility

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lua-51-syntax:
    name: Validate addon Lua 5.1 syntax and UI flow
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Parse addon using Lua 5.1
        run: luac5.1 -p IndividualProgressionAddon.lua
      - name: Check client target, load order and release metadata
        run: |
          grep -q '^## Interface: 30300
      - name: Exercise mocked WoW 3.3.5a UI
        run: lua5.1 tests/test_ui_compatibility.lua

      - name: Assemble validated addon folder
        run: |
          mkdir -p package/IndividualProgressionAddon
          cp IndividualProgressionAddon.toc IndividualProgressionAddon.lua package/IndividualProgressionAddon/
          test -s package/IndividualProgressionAddon/IndividualProgressionAddon.lua
          test -s package/IndividualProgressionAddon/IndividualProgressionAddon.toc
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "Individual Progression Companion - PR test build"
              echo "Not a tagged stable release; do not redistribute as the official release."
              echo "Workflow checkout commit: $(git rev-parse HEAD)"
              echo "Source PR: #${{ github.event.pull_request.number }}"
              echo "Install folder: Interface/AddOns/IndividualProgressionAddon/"
              echo "Back up the existing addon folder and SavedVariables before testing."
            } > package/IndividualProgressionAddon/QA_BUILD_NOTICE.txt
            echo "### PR-only addon artifact" >> "$GITHUB_STEP_SUMMARY"
            echo "Download **IP-Companion-PR-TestBuild** after validation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Standalone addon candidate" >> "$GITHUB_STEP_SUMMARY"
            echo "A validated standalone package is available as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "This artifact is NOT a GitHub tagged Release." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Back up the installed addon and SavedVariables before updating." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PR-only addon test artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: IP-Companion-PR-TestBuild
          path: package/
          if-no-files-found: error
          retention-days: 14
      - name: Upload standalone candidate after main validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: IP-Companion-v5.3.0-Standalone-Candidate
          path: package/
          if-no-files-found: error
          retention-days: 30
