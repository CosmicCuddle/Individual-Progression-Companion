name: WoW 3.3.5a Lua compatibility

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lua-51-syntax:
    name: Validate addon Lua 5.1 syntax and UI flow
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Parse addon using Lua 5.1
        run: luac5.1 -p IndividualProgressionAddon.lua
      - name: Check client target and load order
        run: |
          grep -q '^## Interface: 30300$' IndividualProgressionAddon.toc
          grep -q '^IndividualProgressionAddon.lua$' IndividualProgressionAddon.toc
      - name: Exercise mocked WoW 3.3.5a UI
        run: lua5.1 tests/test_ui_compatibility.lua

      - name: Assemble PR-only addon test package
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p qa-package/IndividualProgressionAddon
          cp IndividualProgressionAddon.toc IndividualProgressionAddon.lua qa-package/IndividualProgressionAddon/
          {
            echo "Individual Progression Companion - PR test build"
            echo "Not a stable release. Do not redistribute as the official tagged version."
            echo "Workflow checkout commit: $(git rev-parse HEAD)"
            echo "Source PR: #${{ github.event.pull_request.number }}"
            echo "Install folder: Interface/AddOns/IndividualProgressionAddon/"
            echo "Back up the existing addon folder and SavedVariables before testing."
          } > qa-package/IndividualProgressionAddon/QA_BUILD_NOTICE.txt
          test -s qa-package/IndividualProgressionAddon/IndividualProgressionAddon.lua
          test -s qa-package/IndividualProgressionAddon/IndividualProgressionAddon.toc
          echo "### QA addon artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests passed; download the **IP-Companion-PR-TestBuild** artifact from this run." >> "$GITHUB_STEP_SUMMARY"
          echo "Extract it into Interface/AddOns only after backing up the existing addon folder." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PR-only addon test artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: IP-Companion-PR-TestBuild
          path: qa-package/
          if-no-files-found: error
          retention-days: 14
